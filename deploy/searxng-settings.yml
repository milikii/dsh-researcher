use_default_settings: true

server:
  secret_key: "<openssl rand -hex 32 生成，勿提交真实值>"
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json
  safe_search: 0
  default_lang: zh-CN

# 引擎出站代理（SearXNG 不读环境变量，必须在此显式配置）
# 默认网络走 mihomo；国内引擎（baidu/sogou/bing）绑定 direct 网络直连，
# 避免百度对代理出口 IP 弹 CAPTCHA（2026-09-01 修复）
outgoing:
  proxies:
    http: http://172.28.0.10:7890
    https: http://172.28.0.10:7890
  networks:
    direct:
      proxies:

engines:
  - name: bing
    disabled: false
    network: direct
    base_url: https://cn.bing.com
  - name: bing news
    disabled: false
  - name: baidu
    disabled: false
    network: direct
  - name: sogou
    disabled: false
    network: direct
  - name: mojeek
    disabled: false
  - name: google
    disabled: false
  - name: google news
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: duckduckgo html
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: google cse
    disabled: true
  - name: mojeek
    disabled: true
  - name: bing images
    disabled: true
  - name: bing videos
