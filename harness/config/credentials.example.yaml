# ~/.dsh/.credentials.yaml 模板 — 真实密钥文件绝不入库！
# 结构:records 每项是 name → 环境变量名, value → 密钥。
version: 1
records:
  OPENCODE_GO_API_KEY:
    value: sk-<opencode-console-go-key>   # opencode.ai zen Console Go 网关
  ANY_API_KEY:
    value: sk-<anyrouter-key>             # anyrouter.top (anthropic 协议)
  AGENT_API_KEY:
    value: sk-<agentrouter-key>            # agentrouter.org (agent/glm 共用)
  ARAK_API_KEY:
    value: sk-<windhub-key>                # windhub.cc (arak, 未启用代理路由)
