# dsh-web proxy drop-in (2026-08-28, updated 2026-09-01)
# 让 dsh web 的所有模型请求走局域网代理 192.168.1.220:7890。
# 原理：Node 22 的 --use-env-proxy 让全局 fetch（undici）读取
# HTTP_PROXY/HTTPS_PROXY/NO_PROXY 环境变量；anyrouter.top / agentrouter.org
# 只有代理可达，opencode.ai / api.deepseek.com / windhub.cc 等保持直连（NO_PROXY）。
[Service]
Environment=NODE_OPTIONS=--use-env-proxy
Environment=HTTP_PROXY=http://192.168.1.220:7890
Environment=HTTPS_PROXY=http://192.168.1.220:7890
Environment=ALL_PROXY=http://192.168.1.220:7890
Environment=NO_PROXY=opencode.ai,api.deepseek.com,windhub.cc,localhost,127.0.0.1
